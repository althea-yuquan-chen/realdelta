[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "realdelta"
version = "0.0.1"
description = "Is that change in your agent eval real, or noise? Intervals, paired comparisons and trial planning for repeated agent evals; interval coverage checked on a pre-registered simulation grid."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
realdelta = "realdelta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["anthropic"]  # examples/haiku only; the library itself does not call any model

[tool.hatch.build.targets.wheel]
packages = ["src/realdelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
