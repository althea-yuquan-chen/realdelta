# Builds the sdist and wheel, tests the built wheel, and publishes both to PyPI when a GitHub release is
# published. Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere. The upload job runs in
# the "pypi" environment, which requires the owner's approval in GitHub before it starts.
# Actions are pinned to commit SHAs (tag in the trailing comment).
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Check the release tag against the package version and main
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel (the sdist's tests, importing the installed package)
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl pytest
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/realdelta-*
          /tmp/wheeltest/bin/python -c "import realdelta, sys; v = realdelta.__version__; print(realdelta.__file__, v); sys.exit(0 if 'v' + v == '${GITHUB_REF_NAME}' else 'installed __version__ ' + v + ' != tag')"
          /tmp/wheeltest/bin/python -m pytest -q -p no:cacheprovider -o pythonpath= -rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/realdelta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
