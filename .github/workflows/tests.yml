# Unit, analytic and calibration tests. Simulations only: no model or API is called and no secret is used.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: the Inspect job against the latest inspect_ai release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The synthetic-demo transcript was recorded with numpy 2.4.4; pinning it (wheels exist for 3.11-3.13
          # on both platforms) lets the byte-for-byte reproduction test run, and REALDELTA_REQUIRE_BYTE_TEST
          # makes it fail rather than skip if the pin ever stops matching. numpy 2.4 has no 3.10 wheels, so
          # on 3.10 that test is skipped by design.
          - python: "3.11"
            numpy: "numpy==2.4.4"
            require_byte_test: "1"
          - python: "3.12"
            numpy: "numpy==2.4.4"
            require_byte_test: "1"
          - python: "3.13"
            numpy: "numpy==2.4.4"
            require_byte_test: "1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      REALDELTA_REQUIRE_BYTE_TEST: ${{ matrix.require_byte_test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" ${{ matrix.numpy }}
      - name: Test
        run: python -m pytest -q -rs

  # The Inspect AI reader, against the oldest and newest inspect_ai versions it was tested on (required), and
  # weekly against the latest release so a format change upstream shows up as a failed scheduled run (GitHub
  # disables scheduled workflows after 60 days without repository activity; re-enable it in the Actions tab).
  # REALDELTA_REQUIRE_INSPECT makes the Inspect tests fail rather than skip if inspect_ai is missing.
  inspect:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        inspect_ai: ["0.3.218", "0.3.292"]
        include:
          - os: windows-latest
            inspect_ai: "0.3.292"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      REALDELTA_REQUIRE_INSPECT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,inspect]" "inspect_ai==${{ matrix.inspect_ai }}"
      - name: Test
        run: python -m pytest -q -rs tests/test_inspect_io.py tests/test_cli_inspect.py

  inspect-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REALDELTA_REQUIRE_INSPECT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,inspect]" --upgrade inspect_ai
      - name: Test
        run: python -m pytest -q -rs tests/test_inspect_io.py tests/test_cli_inspect.py
