# Unit, analytic and calibration tests. Simulations only: no model or API is called and no secret is used.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          # The synthetic-demo transcript was recorded with numpy 2.4.4; pinning it lets the byte-for-byte
          # reproduction test run. numpy 2.4 does not support Python 3.10, where that test is skipped.
          - python: "3.11"
            numpy: "numpy==2.4.4"
          - python: "3.12"
            numpy: "numpy==2.4.4"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" ${{ matrix.numpy }}
      - name: Test
        run: python -m pytest -q -rs
